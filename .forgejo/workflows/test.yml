name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Fmt, Clippy, Test
    runs-on: codeberg-small
    container:
      image: rust:1
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Toolchain components
        run: rustup component add rustfmt clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

  e2e:
    name: Proxy end-to-end
    runs-on: codeberg-small
    container:
      image: rust:1
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Release build
        run: cargo build --release

      - name: End-to-end
        env:
          BIN: ${{ github.workspace }}/target/release/waffle
        run: |
          apt-get update -qq && apt-get install -y -qq python3 curl
          bash tests/e2e.sh
