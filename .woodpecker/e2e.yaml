when:
  - event: [push, pull_request, manual]

steps:
  - name: build
    image: rust:1
    commands:
      - cargo build --release

  - name: e2e
    image: rust:1
    environment:
      BIN: /woodpecker/src/target/release/waffle
    commands:
      - apt-get update -qq && apt-get install -y -qq python3 curl
      - bash tests/e2e.sh
