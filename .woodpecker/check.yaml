when:
  - event: [push, pull_request, manual]

steps:
  - name: fmt
    image: rust:1
    commands:
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: clippy
    image: rust:1
    commands:
      - rustup component add clippy
      - cargo clippy --all-targets -- -D warnings

  - name: test
    image: rust:1
    commands:
      - cargo test --all-targets
